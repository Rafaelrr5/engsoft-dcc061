<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d2733">
<title>Simulados · Engenharia de Software DCC061</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2733;--mute:#66707c;--line:#dde1e6;--ok:#1f8a4c;--okbg:#e6f5ec;--mid:#a86a00;--midbg:#fff4dc;--bad:#c0392b;--badbg:#fbeaea;--acc:#2f5d9a}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1f;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
.hide{display:none}
main{max-width:820px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ed b{display:block;font-size:21px}.ed .sub{display:block;font-size:14px;color:var(--mute);margin:2px 0 8px}
.ed small{color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.note{color:var(--mute);font-size:15px}
.secs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.secs button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font:inherit;font-size:15px}
.secs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.qh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}.qh h2{margin:0;font-size:22px}.unit{color:var(--mute);font-size:14px}
.enun{margin:10px 0 14px;font-size:18px}.enun img,.model img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.enun ol,.enun ul{margin:6px 0;padding-left:24px}
.lbl{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
textarea{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
.mine{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.fb{border-radius:10px;padding:12px 14px;margin:14px 0 10px}
.fb strong{display:block;font-size:18px}
.fb.ok{background:var(--okbg)}.fb.ok strong{color:var(--ok)}.fb.mid{background:var(--midbg)}.fb.mid strong{color:var(--mid)}.fb.bad{background:var(--badbg)}.fb.bad strong{color:var(--bad)}
.chk{list-style:none;margin:0;padding:0}.chk li{margin:6px 0}.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;margin-top:3px}
.model{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.model summary{font-weight:600;cursor:pointer}.model ul,.model ol{padding-left:22px}
.nav2{display:flex;gap:10px;margin-top:12px}
.nav2 button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font:inherit}
.nav2 button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:14px}
.dots button.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dots button.mid{background:var(--midbg);border-color:var(--mid);color:var(--mid)}
.dots button.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
.stats{color:var(--mute);font-size:14px;margin-top:10px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:15px}
td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
td:not(:first-child),th:not(:first-child){text-align:center;white-space:nowrap}
.enun pre,.model pre{overflow-x:auto;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;max-width:100%}
.enun code,.model code{font-size:14px;overflow-wrap:anywhere}
.enun pre code,.model pre code{overflow-wrap:normal;white-space:pre}
.panel{min-width:0;overflow-wrap:anywhere}
.model table,.enun table{display:block;overflow-x:auto;font-size:14px}
</style>
</head>
<body>
<header><button id="back" class="hide">‹ Início</button><h1 id="title">Simulados</h1><button id="res" class="hide">Resultado</button></header>
<main id="app"></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
